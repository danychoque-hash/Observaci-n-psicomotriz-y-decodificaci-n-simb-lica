<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<title>Observación de la expresividad Psicomotriz en la sesión de Psicomotricidad Relacional</title>
<style>
:root{--bg:#f1f5f9;--sf:#fff;--tx:#14284b;--mu:#56657f;--bd:#d6dfea;--ac:#1d5f8a;--acs:#e1edf6;--ok:#1f8f6e;--wr:#c4572e;--dv:#1f8f6e;--dr:#2f6fb0;--da:#c4572e;--ds:#8a4f9e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--sf:#17233a;--tx:#e6edf8;--mu:#9db0cb;--bd:#283957;--ac:#7fb8e6;--acs:#1b3050;--ok:#5fd1a8;--wr:#f2996b;--dv:#5fd1a8;--dr:#7fb8e6;--da:#f2996b;--ds:#c79be0}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:.2em 0;line-height:1.3}.hd{display:flex;align-items:center;gap:12px;padding:8px 0 10px;border-bottom:2px solid var(--ac);margin-bottom:10px}.hd img{flex:none;width:72px;height:72px;border-radius:50%}.hn{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.hn span{font-size:.82rem;color:var(--tx)}.fl{width:27px;height:18px;display:block}.rw{display:flex;align-items:center;gap:8px}.rec .btn{padding:4px 10px;font-size:.8rem;margin-left:6px}
:root{--eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1)}
.card{box-shadow:0 1px 2px rgba(40,30,80,.05)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs button,.btn,.chk,.mat,input,select,textarea{transition:background-color 160ms var(--eo),color 160ms var(--eo),border-color 160ms var(--eo),transform 160ms var(--eo)}
.tabs button:active,.btn:active{transform:scale(.97)}
.chk:active{background:var(--acs)}
.chk:has(input:checked){background:var(--acs);border-radius:10px}
.mat.on{background:color-mix(in srgb,var(--acs) 55%,transparent);border-radius:10px;padding:8px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
@media (hover:hover) and (pointer:fine){.chk:hover{background:var(--acs);border-radius:10px}.btn:hover{filter:brightness(1.07)}.tabs button:not(.on):hover{border-color:var(--ac)}}
.prog{height:3px;background:var(--bd);border-radius:2px;margin:0 0 6px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width 260ms var(--eio)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fadeo{from{opacity:0}}
.sec.on>*{animation:in 220ms var(--eo) both}.sec.on>:nth-child(2){animation-delay:40ms}.sec.on>:nth-child(3){animation-delay:80ms}.sec.on>:nth-child(4){animation-delay:120ms}.sec.on>:nth-child(n+5){animation-delay:160ms}
.bar i{transform-origin:left;animation:grow 400ms var(--eo) both}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;transition:opacity 150ms var(--eo),transform 150ms var(--eo)}
#toast.on{opacity:1;transform:translate(-50%,0);transition-duration:220ms}
@media (prefers-reduced-motion:reduce){.sec.on>*{animation-name:fadeo;animation-delay:0ms!important}.bar i{animation:none}.tabs button:active,.btn:active{transform:none}#toast{transform:translate(-50%,0)}}
@media print{.prog,#toast{display:none!important}.sec.on>*{animation:none}}.hd b{font-size:1.25rem;letter-spacing:.12em;color:var(--ac)}h2{font-size:1.1rem;margin:1.2em 0 .4em}h3{font-size:1rem;margin:.8em 0 .3em;color:var(--ac)}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:.88rem;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
label.f{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.chk:last-child{border:0}.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ac)}
.mat{border-bottom:1px solid var(--bd);padding:8px 0}.mat:last-child{border:0}
.mat select{margin-top:6px;display:none}.mat.on select{display:block}
.mat .h{display:flex;gap:10px;align-items:center;cursor:pointer}.mat .h input{width:20px;height:20px;accent-color:var(--ac)}
.nav{display:flex;justify-content:space-between;gap:8px;margin:16px 0}
.btn{border:0;background:var(--ac);color:#fff;padding:11px 16px;border-radius:12px;font:inherit;cursor:pointer}
.btn.s{background:var(--acs);color:var(--ac)}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:10px;background:var(--acs);color:var(--ac);margin-right:4px}
.rec{border-left:3px solid var(--ac);padding:2px 10px;margin:6px 0}.rec.f{border-color:var(--ok)}
.note{font-size:.82rem;color:var(--mu);background:var(--acs);padding:8px 10px;border-radius:10px}
.sec{display:none}.sec.on{display:block}
@media print{.tabs,.nav,.noprint{display:none!important}.sec{display:block!important}}

h1,h2,h3,.hd b{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif}
h1{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;color:var(--tx)}
h2{font-size:1.3rem;font-weight:700;margin:1.7em 0 .5em;color:var(--tx)}
h3{font-size:1.02rem;font-weight:650;margin:1.3em 0 .3em;color:var(--tx)}
.hd b{font-weight:800;letter-spacing:.03em;font-size:1.75rem;color:var(--tx);line-height:1}
.hd{border-bottom:3px solid var(--da)}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.d-v{--dc:var(--dv)}.d-r{--dc:var(--dr)}.d-a{--dc:var(--da)}.d-s{--dc:var(--ds)}
.dim{margin:16px 0;padding-left:12px;border-left:4px solid var(--dc)}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dim .bar i{background:var(--dc)}.dim small{color:var(--mu)}.dn{margin:6px 0 0;font-size:.95rem;max-width:68ch}
.tag.hi{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.mid{background:var(--acs);color:var(--ac)}
.tag.lo{background:color-mix(in srgb,var(--wr) 18%,transparent);color:var(--wr)}
.obs{border-left:4px solid var(--dc);background:color-mix(in srgb,var(--dc) 7%,var(--sf));border-radius:0 12px 12px 0;padding:8px 14px;margin:10px 0}
.obs p{margin:2px 0 8px;max-width:68ch}.obs .o{font-weight:700}
.k{font-size:.8rem;font-weight:700;color:var(--dc)}
.neu{font-size:.9rem;color:var(--mu)}.neu b{color:var(--tx)}
.mat .h small{margin-left:auto;color:var(--mu);font-size:.78rem}
.uses{display:none;margin-top:6px}.mat.on .uses{display:grid;gap:2px}
.u{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.93rem}
.u input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ac)}
.u:has(input:checked){background:var(--acs)}

<h1>Observación de la expresividad Psicomotriz en la sesión de Psicomotricidad Relacional</h1>
<p class="sub">Registra lo observado en la sesión y obtén una lectura simbólica, ajustes para el terapeuta y orientaciones para la familia.</p>
<div class="tabs" id="tabs"></div>
<div class="prog"><i id="pg"></i></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
</main>
<script>
const SECS=["Datos","Tipo de juego","Terapeuta y pares","Materiales","Espacio y tiempo","Resultado","Historial"];
const DIMS={v:"Vínculo y seguridad afectiva",r:"Regulación tónico-emocional",a:"Autonomía y exploración",s:"Simbolización y expresión"};
// [id, texto, dim, peso(+fortaleza/-necesidad), interpretación, rec terapeuta, rec familia]
const G={
"Tipo de juego":[
["sm","Sensoriomotor: correr, saltar, rodar, balancearse","r",1,"Placer sensoriomotor y descarga tónica; construye esquema corporal y confianza en el propio movimiento.","Variar superficies, ritmos y alturas; nombrar sensaciones (“¡qué rápido!”) para dar palabra a la vivencia corporal.","Ofrecer a diario movimiento libre (parque, rodar, saltar) sin objetivo de rendimiento."],
["rp","Reaseguración profunda: caer, esconderse, ser atrapado, destruir y construir","v",1,"Elabora angustias de pérdida, separación o fusión; el niño pone a prueba si el adulto sostiene y no se rompe.","Sostener con disponibilidad tónica, no interrumpir ni interpretar en el momento; dejar que el juego se repita.","Juegos de escondite y reencuentro en casa; rituales claros de llegada y despedida."],
["sim","Simbólico: roles, historias, personajes","s",1,"Capacidad de representar vivencias; el juego transforma lo corporal en relato y distancia lo difícil.","Entrar en el rol que el niño asigne, ampliar la historia sin dirigirla; devolver en palabras su narrativa.","Leer, dramatizar y dejar tiempo de juego de roles libre; evitar corregir el contenido de la historia."],
["rep","Repetitivo o estereotipado, sin transformación","r",-1,"Posible función de autorregulación o defensa ante la angustia; el juego no evoluciona porque aún no hay suficiente seguridad.","Acompañar la repetición, espejarla y luego introducir pequeñas variaciones (ritmo, material) con su consentimiento.","Respetar rutinas que lo calman, e introducir cambios graduales y anticipados."],
["dis","Disperso: cambia de actividad sin sostener ninguna","r",-1,"Dificultad para sostener la tensión emocional o la atención; puede huir de lo que moviliza.","Reducir estímulos, ofrecer pocos materiales y un marco espacial claro; sostener con la mirada y la voz.","Ambientes con pocos estímulos al jugar; juegos cortos con inicio y fin definidos."],
["ev","Evita jugar o solo observa desde fuera","a",-1,"Inhibición, prudencia o falta de seguridad para exponerse; necesita tiempo de observación como forma de participar.","Respetar el ritmo, no forzar; presencia cercana y propuestas de baja exigencia (compartir un material a distancia).","No presionar para “que juegue”; acompañar en juegos que él elija y valorar su forma de participar."],
["con","Construcción o juego con reglas","a",1,"Búsqueda de control, orden y logro; apoyo en la estructura para organizarse.","Proponer retos compartidos y permitir que el niño ponga las reglas; abrir espacio a lo lúdico no controlado.","Combinar juegos con reglas y tiempos de juego libre y espontáneo."]],
"Frente al terapeuta":[
["tb","Busca contacto, mirada o contacto corporal","v",1,"Confía en el adulto como base segura y demanda sostén afectivo.","Responder con presencia corporal sintonizada y regulada.","Mantener momentos diarios de contacto uno a uno (cuentos, masajes, juegos cuerpo a cuerpo)."],
["ti","Invita al terapeuta a jugar y comparte el juego","v",1,"Vínculo en construcción con capacidad de reciprocidad.","Aceptar y seguir su guion; intervenir como compañero simbólico.","Dedicar rato diario de juego dirigido por el niño."],
["tr","Evita o rechaza al terapeuta","v",-1,"Desconfianza, necesidad de distancia o dificultad para tolerar la cercanía.","Mantenerse a distancia respetuosa, disponible y predecible; acercarse sólo por invitación.","Respetar los tiempos de acercamiento del niño; evitar forzar besos o abrazos."],
["tc","Controla o dirige: asigna al adulto roles estrictos","a",-1,"Necesidad de control para sentirse seguro; puede ocultar ansiedad.","Aceptar el rol, pero devolver pequeñas sorpresas; ofrecer límites calmos y constantes.","Dar elecciones acotadas en casa y límites firmes y cálidos."],
["tl","Pone a prueba los límites o desafía","a",1,"Explora la contención del adulto y afirma su identidad.","Sostener el límite con calma, sin castigo; nombrar la emoción detrás del desafío.","Normas simples, coherentes y explicadas; reconocer la emoción antes de poner el límite."],
["ts","Se somete: espera instrucciones, busca aprobación","a",-1,"Posible inhibición de la iniciativa; temor a equivocarse.","Devolver la iniciativa (“¿qué quieres hacer?”); celebrar lo espontáneo y no sólo lo correcto.","Valorar el proceso más que el resultado; dar oportunidades de decidir."]],
"Espacio":[
["ec","Ocupa el centro y usa todo el espacio con soltura","a",1,"Seguridad para explorar y ocuparse de un lugar propio.","Ampliar el espacio con nuevos desafíos de altura o amplitud.","Dar zonas de movimiento amplio en casa o fuera."],
["ep","Se mantiene en el borde, esquinas o en un refugio","v",-1,"Búsqueda de protección y delimitación; el refugio funciona como útero simbólico.","Respetar el refugio, acompañar desde fuera y ampliar la exploración por pasos.","Un rincón propio y seguro en casa (cabaña, tienda) como lugar de calma."],
["ea","Trepa y busca alturas","a",1,"Deseo de dominio, diferenciación y reconocimiento de la propia potencia.","Garantizar seguridad física y mostrarse como espectador admirativo.","Actividades de trepar supervisadas y celebrar logros sin sobreprotección."],

const DN={
v:{hi:"Hay indicios de una base segura internalizada (Bowlby, Winnicott): el niño tolera la distancia y busca al adulto para recargarse. Neurobiológicamente se asocia a circuitos de apego y oxitocina, con buena co-regulación y predominio del sistema de compromiso social (vago ventral).",mid:"La confianza relacional se está construyendo: alterna acercamiento y retirada, el vaivén propio de la separación-individuación (Mahler). La red de apego necesita experiencias repetidas de sintonía para estabilizarse.",lo:"El vínculo funciona como zona de alerta: la cercanía puede vivirse como amenaza o como pérdida posible. Desde la teoría polivagal, la neurocepción de peligro prima sobre el compromiso social; necesita previsibilidad, ritmo y presencia antes que interpretación."},
r:{hi:"Buena capacidad de modular el tono y la excitación: la descarga motriz se organiza y retorna a la calma. Indica una ventana de tolerancia amplia (Siegel) y buena integración entre sistema límbico y corteza prefrontal.",mid:"La regulación funciona con apoyo externo: se organiza mejor cuando el adulto ofrece contención tónica y estructura. La co-regulación repetida teje la autorregulación, mientras los circuitos prefrontales maduran.",lo:"La activación se desborda o se apaga con facilidad (hiper o hipoactivación): ventana de tolerancia estrecha, con amígdala que reacciona antes de que la corteza prefrontal medie. Necesita contención corporal, presión profunda, pausas y ritmos predecibles."},

function nm(m){const o={};for(const k in (m||{}))o[k]=Array.isArray(m[k])?m[k]:[m[k]];return o}
function lv(p,t){return !t?['Sin datos','n']:p>=70?['Recurso presente','hi']:p>=40?['En construcción','mid']:['Necesita apoyo','lo']}
function obs(it){return `<div class="obs d-${it[2]}"><div class="k">Observado</div><p class="o">${it[1]}</p><div class="k">Decodificación</div><p>${it[4]}</p><p class="neu"><b>Neurociencia:</b> ${NEU[it[0]]||''}</p></div>`}

let step=0,sel={},mat={},meta={};

const tabs=$("#tabs"),app=$("#app");
function drawTabs(){tabs.innerHTML=SECS.map((s,i)=>`<button class="${i==step?'on':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join("")}
function go(i){step=i;render();window.scrollTo(0,0)}
function nav(){return `<div class="nav noprint">${step>0?`<button class="btn s" onclick="go(${step-1})">← Atrás</button>`:'<span></span>'}${step<5?`<button class="btn" onclick="go(${step+1})">${step==4?'Ver resultado':'Siguiente'} →</button>`:''}</div>`}

function render(){drawTabs();pgUpdate();let h="";

<label class="f">Edad</label><input value="${meta.e||''}" oninput="meta.e=this.value" placeholder="Ej. 4 años 3 meses">

<label class="f">Motivo de consulta o contexto</label><textarea rows="3" oninput="meta.c=this.value">${meta.c||''}</textarea><label class="f">Enfoque teórico de referencia (opcional)</label><input value="${meta.f||''}" oninput="meta.f=this.value" placeholder="Ej. Aucouturier, Lapierre"></div>
<p class="note">Marca únicamente lo que observes con claridad. El resultado son hipótesis de trabajo que se contrastan con el equipo y la familia; no es un diagnóstico.</p>`;

if(step==2)h=checks(["Frente al terapeuta","Con los otros niños"]);

if(step==4)h=checks(["Espacio","Tiempo"])+`<h3>Observaciones libres del terapeuta</h3><div class="card"><textarea rows="5" placeholder="Frases del niño, momentos significativos, reacciones, dudas..." oninput="meta.o=this.value">${meta.o||''}</textarea></div>`;

function calc(){const sc={v:[0,0],r:[0,0],a:[0,0],s:[0,0]};Object.values(G).flat().filter(it=>sel[it[0]]).forEach(it=>sc[it[2]][it[3]>0?0:1]++);Object.keys(mat).forEach(i=>(mat[i]||[]).forEach(j=>{const u=M[i][1][j];if(u)sc[u[2]][0]++}));const p={};for(const k in sc){const n=sc[k][0]+sc[k][1];p[k]=n?Math.round(sc[k][0]/n*100):null}return p}
function H(){try{return JSON.parse(localStorage.getItem('apetepsi_h')||'[]')}catch(e){return[]}}
function SH(a){try{localStorage.setItem('apetepsi_h',JSON.stringify(a));return true}catch(e){return false}}
function saveS(){const a=H();a.push({id:Date.now(),meta:{...meta},sel:{...sel},mat:{...mat},p:calc()});toast(SH(a)?'Sesión guardada en este dispositivo':'No se pudo guardar en este navegador')}
function openS(id){const s=H().find(x=>x.id==id);if(!s)return;meta={...s.meta};sel={...s.sel};mat=nm(s.mat);go(5)}
function delS(id){if(confirm('¿Borrar esta sesión?')){SH(H().filter(x=>x.id!=id));render()}}
let hf='';

const evo=Object.keys(DIMS).map(k=>{const vals=L.map(x=>x.p[k]);const f=vals.filter(v=>v!==null);const tr=f.length<2?'1 sesión':f[f.length-1]>f[0]?'↑ mejora':f[f.length-1]<f[0]?'↓ requiere atención':'= estable';return `<div style='margin:12px 0'><b>${DIMS[k]}</b> <span class='tag'>${tr}</span><div style='display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:4px'>${vals.map((v,i)=>`<div style='flex:1;text-align:center;font-size:.7rem'><div style='background:var(--ok);height:${v===null?2:Math.max(2,v*.45)}px;border-radius:4px'></div>S${i+1}: ${v===null?'–':v+'%'}</div>`).join('')}</div></div>`}).join('');
return `<label class='f'>Niño/a</label><select onchange='hf=this.value;render()'>${names.map(n=>`<option ${n==hf?'selected':''}>${n}</option>`).join('')}</select><h2>Evolución por dimensión</h2><div class='card'>${evo}</div><h2>Sesiones guardadas</h2><div class='card'>${L.map((x,i)=>`<div class='rec'>S${i+1} · ${lab(x)}<button class='btn s' onclick='openS(${x.id})'>Abrir</button><button class='btn s' onclick='delS(${x.id})'>Borrar</button></div>`).join('')}</div><p class='note'>Las sesiones se guardan sólo en este navegador y dispositivo. Imprime o exporta el resultado para conservarlo en otro lugar.</p>`}
function pgUpdate(){$('#pg').style.width=((step+1)/SECS.length*100)+'%';const o=tabs.querySelector('.on');if(o)o.scrollIntoView({inline:'center',block:'nearest'})}

function tm(i,c){if(c)mat[i]=mat[i]||[];else delete mat[i];const el=$('#m'+i);el.classList.toggle('on',c);if(!c)el.querySelectorAll('.u input').forEach(x=>x.checked=false)}

function result(){
const items=Object.values(G).flat().filter(it=>sel[it[0]]);
const mk=Object.keys(mat).filter(i=>(mat[i]||[]).length);

items.forEach(it=>sc[it[2]][it[3]>0?0:1]++);

const needs=Object.keys(DIMS).filter(k=>sc[k][1]>sc[k][0]).map(k=>DIMS[k].toLowerCase());
const res=Object.keys(DIMS).filter(k=>sc[k][0]>sc[k][1]).map(k=>DIMS[k].toLowerCase());

const uniq=a=>[...new Set(a)];
const ter=uniq(items.map(i=>i[5])),fam=uniq(items.map(i=>i[6]));
return `<div class="card"><h2 style="margin-top:0">Síntesis</h2><p>${syn}</p>${prof}</div>

${mh?`<h2>Decodificación simbólica de los materiales</h2>${mh}`:''}
